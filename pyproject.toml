[project]
name = "nonprofit-ai-workshop"
version = "0.1.0"
description = "A one-hour workshop kit that teaches nonprofit staff to use Claude carefully: asking well, checking answers, protecting client privacy, and knowing when not to use it."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Nathanael Johnson", email = "nathanaeljdj@gmail.com" }
]
dependencies = [
    "markdown>=3.11.2",
]

[project.scripts]
workshop = "workshop.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workshop"]
